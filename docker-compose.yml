services:
  mcp-servers:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copilot-mcp-servers
    volumes:
      # Mount the MCP config
      - ./mcp-config.json:/mcp/mcp-config.json:ro
      # Mount docker socket for awesome-copilot server
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
